name: VPS Guard CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Test on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Bash syntax
        run: |
          find . -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n
          bash -n bin/vpsg

      - name: Run VPS Guard tests
        run: |
          bash ./tests/run.sh

      - name: Run ShellCheck
        run: |
          find bin core modules scripts tests \
            -type f \( -name "*.sh" -o -name "vpsg" \) \
            -print0 | xargs -0 shellcheck -x
          shellcheck -x install.sh uninstall.sh
